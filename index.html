  let currentIndex = -1;
  let isAnimating = false;

  function getRandomWish() {
    let idx;
    do {
      idx = Math.floor(Math.random() * wishes.length);
    } while (idx === currentIndex && wishes.length > 1);
    currentIndex = idx;
    return { ...wishes[idx], index: idx + 1 };
  }

  function showWish() {
    if (isAnimating) return;
    isAnimating = true;
    const wish = getRandomWish();
    const box = document.getElementById('wishBox');
    const num = document.getElementById('wishNum');
    const emoji = document.getElementById('wishEmoji');
    const text = document.getElementById('wishText');

    box.classList.add('flash');
    text.style.transition = 'opacity 0.2s';
    emoji.style.transition = 'opacity 0.2s';
    text.style.opacity = '0';
    emoji.style.opacity = '0';

    setTimeout(() => {
      num.textContent = `第 ${wish.index} / 100 条`;
      emoji.textContent = wish.emoji;
      text.textContent = wish.text;
      text.style.opacity = '1';
      emoji.style.opacity = '1';
      emoji.style.animation = 'none';
      emoji.offsetHeight;
      emoji.style.animation = 'emojiBounce 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
      setTimeout(() => {
        box.classList.remove('flash');
        isAnimating = false;
      }, 300);
    }, 200);
  }

  const style = document.createElement('style');
  style.textContent = `
    @keyframes emojiBounce {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  `;
  document.head.appendChild(style);

  // 海面波光
  function createSparkles() {
    const container = document.getElementById('sparkles');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 60 + '%';
      s.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      s.style.animationDelay = Math.random() * 2 + 's';
      s.style.width = (Math.random() * 3 + 2) + 'px';
      s.style.height = s.style.width;
      container.appendChild(s);
    }
  }

  // 飘落
  function createFalling() {
    const items = ['🌸', '🌼', '✨', '🍂', '🥮', '⭐', '💫', '🕊️', '🍁'];
    setInterval(() => {
      const el = document.createElement('div');
      el.className = 'falling';
      el.textContent = items[Math.floor(Math.random() * items.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (Math.random() * 5 + 7) + 's';
      el.style.fontSize = (Math.random() * 12 + 14) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 13000);
    }, 700);
  }

  // 粒子
  function createParticles(x, y) {
    const particles = ['✨', '⭐', '💫', '🌟', '🥮', '🌕', '🚢', '🕊️', '🌊', '🏠'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = particles[Math.floor(Math.random() * particles.length)];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      const angle = (i / 14) * Math.PI * 2;
      const dist = 60 + Math.random() * 60;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.fontSize = (Math.random() * 10 + 16) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  const btn = document.getElementById('wishBtn');
  btn.addEventListener('click', (e) => {
    const rect = btn.getBoundingClientRect();
    createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    showWish();
  });

  // 摇一摇
  let lastShake = 0;
  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', (e) => {
      const acc = e.accelerationIncludingGravity;
      if (!acc) return;
      const now = Date.now();
      if (now - lastShake < 1500) return;
      const total = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
      if (total > 30) {
        lastShake = now;
        createParticles(window.innerWidth / 2, window.innerHeight / 2);
        showWish();
      }
    });
  }

  // 键盘
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      const rect = btn.getBoundingClientRect();
      createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
      showWish();
    }
  });

  // 初始化
  createSparkles();
  setTimeout(showWish, 500);
  setTimeout(createFalling, 1000);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) setTimeout(showWish, 300);
  });
